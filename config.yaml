# RSV Timing / 2026 Extended Analysis Pipeline Configuration
# 3-season NSSP analysis (2023-24, 2024-25, 2025-26) and 2-season NHSN analysis

# Data source - NSSP Emergency Department Visit Trajectories
socrata:
  dataset_id: "rdmq-nq56"
  base_url: "https://data.cdc.gov/resource"
  timeout: 30
  max_retries: 3
  page_size: 50000

# Fields to extract from Socrata
fields:
  week_end: "week_end"
  geography: "geography"
  rsv_pct: "percent_visits_rsv"
  rsv_pct_smoothed: "percent_visits_smoothed_rsv"
  covid_pct: "percent_visits_covid"
  flu_pct: "percent_visits_influenza"
  combined_pct: "percent_visits_combined"

# Data source - NHSN Weekly Hospital Respiratory Data (HRD)
nhsn:
  dataset_id: "ua7e-t2fy"
  base_url: "https://data.cdc.gov/resource"
  timeout: 30
  max_retries: 3
  page_size: 50000

# Fields to extract from NHSN HRD
nhsn_fields:
  week_end: "weekendingdate"
  jurisdiction: "jurisdiction"
  rsv_ped_0_4: "numconfrsvnewadmped0to4"
  rsv_ped_total: "totalconfrsvnewadmped"
  rsv_total: "totalconfrsvnewadm"

# Season definitions (July-June to capture early summer activity)
# 3 full NSSP seasons; 2025-26 ends June 30 2026 (data may lag 2-4 weeks)
seasons:
  - name: "2023-2024"
    start: "2023-07-01"
    end: "2024-06-30"
  - name: "2024-2025"
    start: "2024-07-01"
    end: "2025-06-30"
  - name: "2025-2026"
    start: "2025-07-01"
    end: "2026-06-30"

# NHSN seasons: 2023-24 now included (completeness assessed at runtime).
# Set include_nhsn_2023_24 to false to exclude if <45 states report.
nhsn_seasons:
  - name: "2023-2024"
    start: "2023-07-01"
    end: "2024-06-30"
    min_reporting_states: 45   # exclude this season if fewer states reported
  - name: "2024-2025"
    start: "2024-07-01"
    end: "2025-06-30"
    min_reporting_states: 40
  - name: "2025-2026"
    start: "2025-07-01"
    end: "2026-06-30"
    min_reporting_states: 40

# Primary outcome fields
primary_outcome: "rsv_pct"
nhsn_primary_outcome: "rsv_ped_0_4"

# All NHSN age strata to run burden analysis on
nhsn_age_strata:
  - col: "rsv_ped_0_4"
    label: "Pediatric RSV hospital admissions, ages 0-4"
    short_label: "Ages 0-4"
  - col: "rsv_ped_total"
    label: "Pediatric RSV hospital admissions, all pediatric"
    short_label: "All pediatric"
  - col: "rsv_total"
    label: "RSV hospital admissions, all ages"
    short_label: "All ages"

# Labels used in figures and tables
labels:
  nssp_metric: "RSV ED visit percentage of total ED visits, all ages"
  nhsn_metric: "Pediatric RSV hospital admissions, ages 0-4"
  nssp_timeseries: "RSV ED visit %"
  nhsn_timeseries: "RSV-associated hospital admissions"
  nssp_fraction: "RSV ED visit percentage of total ED visits, all ages"
  nhsn_fraction: "Pediatric RSV hospital admissions, ages 0-4"

# Fixed prophylaxis window (per season year Y: Oct 1 Y to Mar 31 Y+1)
fixed_window:
  start_month: 10
  start_day: 1
  end_month: 3
  end_day: 31

# Analysis parameters
analysis:
  smoothing_window: 3
  material_activity_threshold: 0.20
  material_activity_sensitivity: 0.10
  bootstrap_replicates: 10000
  bootstrap_seed: 42

# Alternative fixed prophylaxis windows evaluated in the analysis:
#   baseline_oct_mar: Oct 1 - Mar 31
#   early_sep_mar:    Sep 1 - Mar 31
#   late_oct_apr:     Oct 1 - Apr 30
#   extended_sep_apr: Sep 1 - Apr 30

# Infant prophylaxis protection model. This is a deliberately explainable
# visit-opportunity model: births are uniform by day, eligible infants receive
# prophylaxis at the first routine well-child visit that falls inside the
# scenario window, and protection is evaluated against each state's observed
# RSV curve.
infant_ppx_model:
  enabled: true
  uptake: 1.0
  eligibility_max_age_months: 8
  exposure_censor_age_months: 12
  protection_delay_days: 6       # median nirsevimab time to maximum concentration
  protection_duration_days: 180  # six-month base assumption; 150 days is a sensitivity to consider
  efficacy_profile: "binary"     # binary or piecewise_linear
  efficacy_curve_points:
    # Optional piecewise_linear profile. Main infant-model figures use this Moline et al.
    # JAMA Pediatrics 2026 hospitalization VE sensitivity with a monotone
    # smoothed curve: day 6 is the PK delay and the <30 day VE bin, day 45 is
    # the midpoint of the 30-59 day bin, and day 210 is the end of the final
    # observed 130-210 day bin.
    - day: 0
      efficacy: 0.0
    - day: 6
      efficacy: 0.936
    - day: 45
      efficacy: 0.807
    - day: 210
      efficacy: 0.789
  first_outpatient_visit_days: [7, 14]
  first_outpatient_visit_probabilities: [0.5, 0.5]
  well_child_visit_days: [7, 14, 30.4375, 60.875, 121.75, 182.625]
  birth_weight_scheme: "uniform"  # uniform or seasonal_national
  birth_month_weight_multipliers:
    # Mild monthly birth-seasonality sensitivity. These are transparent national
    # multipliers, not state-specific natality rates. Values are normalized
    # during simulation; they only change the relative weight of birth cohorts.
    1: 0.97
    2: 0.91
    3: 0.99
    4: 0.97
    5: 1.00
    6: 1.00
    7: 1.04
    8: 1.07
    9: 1.06
    10: 1.03
    11: 0.98
    12: 0.98
  allow_window_start_catchup: false

# Citable priors for optional "more realistic delivery" sensitivities. These
# are used in the main infant-model figures. The full citation trail is written to
# results/tables/infant_ppx_realistic_priors.csv.
infant_ppx_realistic_priors:
  nirsevimab_uptake_2023_24: 0.185
  combined_infant_protection_2024_25: 0.57
  newborn_first_week_nirsevimab_receipt: 0.381
  routine_visit_completion_first_15_months: 0.59
  routine_visit_delay_days: 14
  medically_attended_rsv_ari_peak_effectiveness: 0.89
  rsv_hospitalization_peak_effectiveness: 0.93
  moline_hospitalization_effectiveness_6_29_days: 0.936
  moline_hospitalization_effectiveness_30_59_days: 0.807
  moline_hospitalization_effectiveness_60_89_days: 0.790
  moline_hospitalization_effectiveness_90_129_days: 0.564
  moline_hospitalization_effectiveness_130_210_days: 0.789

# Translation from modeled protection to expected hospitalizations averted.
# This keeps the timing model based on state RSV curves and uses external,
# citable denominators/burden rates only for absolute impact.
infant_hospitalization_translation:
  enabled: true
  datasource: "nssp"
  scenario_id: "uptake_100"
  comparison_window: "early_sep_mar"
  baseline_window: "baseline_oct_mar"
  infant_population_file: "data/raw/us_state_infant_population_2023_census_pep.csv"
  infant_population_year: 2023
  baseline_hospitalization_risk_per_infant_season: 0.011774214704994403
  baseline_hospitalization_risk_per_1000_infants: 11.774214704994403
  burden_source: "Pelletier et al. JAMA Network Open 2025 untreated infants: 2,535 RSV-associated hospitalizations among 215,301 untreated infants."
  population_source: "U.S. Census Bureau Population Estimates Program, Vintage 2023 Annual Resident Population Estimates by Single Year of Age and Sex, age under 1 year."

# Geographic scope
geography:
  # Include all available states and District of Columbia. Exclude only
  # aggregate rows and territories by default.
  florida_note: >
    Florida included when source data are available. CDC provides year-round
    nirsevimab guidance for Florida, so interpret Florida separately in any
    policy-facing summary.
  exclude_jurisdictions:
    - "USA"
    - "Region 1"
    - "Region 2"
    - "Region 3"
    - "Region 4"
    - "Region 5"
    - "Region 6"
    - "Region 7"
    - "Region 8"
    - "Region 9"
    - "Region 10"
    - "AS"
    - "GU"
    - "MP"
    - "PR"
    - "VI"
    - "Guam"
    - "Puerto Rico"
    - "Virgin Islands"
    - "National"

  southeast_states:
    - "Georgia"
    - "Alabama"
    - "Mississippi"
    - "Louisiana"
    - "South Carolina"
    - "North Carolina"
    - "Tennessee"
    - "Arkansas"

  comparator_states:
    - "New York"
    - "Minnesota"

# HHS Region mappings (full state names)
hhs_regions:
  1: ["Connecticut", "Maine", "Massachusetts", "New Hampshire", "Rhode Island", "Vermont"]
  2: ["New Jersey", "New York"]
  3: ["Delaware", "District of Columbia", "Maryland", "Pennsylvania", "Virginia", "West Virginia"]
  4: ["Alabama", "Florida", "Georgia", "Kentucky", "Mississippi", "North Carolina", "South Carolina", "Tennessee"]
  5: ["Illinois", "Indiana", "Michigan", "Minnesota", "Ohio", "Wisconsin"]
  6: ["Arkansas", "Louisiana", "New Mexico", "Oklahoma", "Texas"]
  7: ["Iowa", "Kansas", "Missouri", "Nebraska"]
  8: ["Colorado", "Montana", "North Dakota", "South Dakota", "Utah", "Wyoming"]
  9: ["Arizona", "California", "Hawaii", "Nevada"]
  10: ["Alaska", "Idaho", "Oregon", "Washington"]

# Output settings
output:
  figure_dpi: 300
  figure_format: ["png", "pdf"]
